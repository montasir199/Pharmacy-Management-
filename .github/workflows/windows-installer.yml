name: Windows installer

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install NSIS
        run: choco install nsis --yes --no-progress

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend
        run: npm test

      - name: Test Rust backend
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Verify updater signing secrets
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw "Missing GitHub secret TAURI_SIGNING_PRIVATE_KEY"
          }
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD) {
            throw "Missing GitHub secret TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          }

      - name: Build Windows installer
        run: npm run tauri build -- --bundles nsis --ci
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Smoke-test Windows installer
        shell: pwsh
        run: |
          $bundleDir = "src-tauri/target/release/bundle/nsis"
          $installer = Get-ChildItem -Path $bundleDir -Filter "*.exe" -File | Select-Object -First 1
          if (-not $installer) {
            throw "No NSIS installer was produced in $bundleDir"
          }
          $installDir = Join-Path $env:RUNNER_TEMP "dawai-pharmacy-install"
          $process = Start-Process -FilePath $installer.FullName -ArgumentList @("/S", "/D=$installDir") -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "NSIS installer exited with code $($process.ExitCode)"
          }
          $installedApp = Get-ChildItem -Path $installDir -Filter "*.exe" -File |
            Where-Object { $_.Name -notmatch "uninstall" } |
            Select-Object -First 1
          if (-not $installedApp) {
            throw "The installer completed but no application executable was found in $installDir"
          }

      - name: Create update manifest and GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          $bundleDir = "src-tauri/target/release/bundle/nsis"
          $installer = Get-ChildItem -Path $bundleDir -Filter "*.exe" -File | Select-Object -First 1
          if (-not $installer) {
            throw "No NSIS installer was produced in $bundleDir"
          }
          $signaturePath = "$($installer.FullName).sig"
          if (-not (Test-Path -Path $signaturePath -PathType Leaf)) {
            throw "Updater signature was not produced: $signaturePath"
          }
          $signature = Get-Content $signaturePath -Raw
          $manifest = @{
            version = $version
            notes = "Update available for Dawai Pharmacy"
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = @{
                signature = $signature.Trim()
                url = "https://github.com/montasir199/Pharmacy-Management-/releases/download/$tag/$($installer.Name)"
              }
            }
          } | ConvertTo-Json -Depth 5
          Set-Content -Path "$bundleDir/latest.json" -Value $manifest -Encoding utf8
          gh release delete $tag --yes --cleanup-tag 2>$null
          gh release create $tag `
            --target "${{ github.sha }}" `
            --title "Dawai Pharmacy $version" `
            --notes "Signed Windows installer for Dawai Pharmacy $version" `
            "$($installer.FullName)" "$bundleDir/latest.json"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Dawai-Windows-Installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
