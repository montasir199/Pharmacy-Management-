name: Windows installer

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install NSIS
        run: choco install nsis --yes --no-progress

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend
        run: npm test

      - name: Test Rust backend
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Verify updater signing secrets
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw "Missing GitHub secret TAURI_SIGNING_PRIVATE_KEY"
          }
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD) {
            throw "Missing GitHub secret TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          }

      - name: Build Windows installer
        run: npm run tauri build -- --bundles nsis --ci
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Smoke-test Windows installer
        shell: pwsh
        run: |
          $bundleDir = "src-tauri/target/release/bundle/nsis"
          $installer = Get-ChildItem -Path $bundleDir -Filter "*.exe" -File | Select-Object -First 1
          if (-not $installer) {
            throw "No NSIS installer was produced in $bundleDir"
          }
          $installDir = Join-Path $env:RUNNER_TEMP "dawai-pharmacy-install"
          $process = Start-Process -FilePath $installer.FullName -ArgumentList @("/S", "/D=$installDir") -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "NSIS installer exited with code $($process.ExitCode)"
          }
          $installedApp = Get-ChildItem -Path $installDir -Filter "*.exe" -File |
            Where-Object { $_.Name -notmatch "uninstall" } |
            Select-Object -First 1
          if (-not $installedApp) {
            throw "The installer completed but no application executable was found in $installDir"
          }

      - name: Create update manifest and GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          $bundleDir = "src-tauri/target/release/bundle/nsis"
          $installer = Get-ChildItem -Path $bundleDir -Filter "*.exe" -File | Select-Object -First 1
          if (-not $installer) {
            throw "No NSIS installer was produced in $bundleDir"
          }

          # Tauri's Windows updater requires the signed NSIS updater archive,
          # not the standalone .exe installer used for manual installation.
          $updaterBundle = Get-ChildItem -Path $bundleDir -Filter "*.nsis.zip" -File | Select-Object -First 1
          if (-not $updaterBundle) {
            throw "Tauri NSIS updater archive (*.nsis.zip) was not produced in $bundleDir"
          }
          $signaturePath = "$($updaterBundle.FullName).sig"
          if (-not (Test-Path -Path $signaturePath -PathType Leaf)) {
            throw "Updater archive signature was not produced: $signaturePath"
          }
          $signature = (Get-Content $signaturePath -Raw).Trim()
          if ([string]::IsNullOrWhiteSpace($signature)) {
            throw "Updater archive signature is empty"
          }

          $manifest = @{
            version = $version
            notes = "Update available for Dawai Pharmacy"
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = @{
                signature = $signature
                url = "https://github.com/montasir199/Pharmacy-Management-/releases/download/$tag/$($updaterBundle.Name)"
              }
            }
          } | ConvertTo-Json -Depth 5
          Set-Content -Path "$bundleDir/latest.json" -Value $manifest -Encoding utf8

          $manifestCheck = Get-Content "$bundleDir/latest.json" -Raw | ConvertFrom-Json
          if ($manifestCheck.version -ne $version -or
              -not $manifestCheck.platforms.'windows-x86_64'.url.EndsWith(".nsis.zip") -or
              [string]::IsNullOrWhiteSpace($manifestCheck.platforms.'windows-x86_64'.signature)) {
            throw "Generated updater manifest failed validation"
          }

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $tag `
              --title "Dawai Pharmacy $version" `
              --notes "Signed Windows installer and updater archive for Dawai Pharmacy $version"
            if ($LASTEXITCODE -ne 0) {
              throw "Could not update the existing GitHub release $tag"
            }
          } else {
            gh release create $tag `
              --target "${{ github.sha }}" `
              --title "Dawai Pharmacy $version" `
              --notes "Signed Windows installer and updater archive for Dawai Pharmacy $version"
            if ($LASTEXITCODE -ne 0) {
              throw "Could not create GitHub release $tag"
            }
          }

          gh release upload $tag "$($installer.FullName)" "$($updaterBundle.FullName)" "$signaturePath" "$bundleDir/latest.json" --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "Could not upload the installer, signed updater archive, and manifest to $tag"
          }

      - name: Verify published updater feed and download assets
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          $manifestUrl = "https://github.com/montasir199/Pharmacy-Management-/releases/download/$tag/latest.json"
          $response = Invoke-WebRequest -Uri $manifestUrl -Method Get
          if ($response.StatusCode -ne 200) {
            throw "Published updater manifest returned HTTP $($response.StatusCode)"
          }
          $manifest = $response.Content | ConvertFrom-Json
          if ($manifest.version -ne $version) {
            throw "Published updater manifest version '$($manifest.version)' does not match app version '$version'"
          }
          $platform = $manifest.platforms.'windows-x86_64'
          if (-not $platform -or
              [string]::IsNullOrWhiteSpace($platform.url) -or
              [string]::IsNullOrWhiteSpace($platform.signature) -or
              -not $platform.url.EndsWith(".nsis.zip")) {
            throw "Published updater manifest has an invalid Windows x64 updater entry"
          }
          $updaterPath = Join-Path $env:RUNNER_TEMP "published-updater.nsis.zip"
          Invoke-WebRequest -Uri $platform.url -OutFile $updaterPath
          if ((Get-Item $updaterPath).Length -lt 1000000) {
            throw "Published updater archive is missing or unexpectedly small"
          }
          $installerUrl = "https://github.com/montasir199/Pharmacy-Management-/releases/download/$tag/Dawai.Pharmacy_$($version)_x64-setup.exe"
          $installerPath = Join-Path $env:RUNNER_TEMP "published-installer.exe"
          Invoke-WebRequest -Uri $installerUrl -OutFile $installerPath
          if ((Get-Item $installerPath).Length -lt 1000000) {
            throw "Published standalone installer is missing or unexpectedly small"
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Dawai-Windows-Installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
