[package]
name = "pharmacy-management"
version = "0.2.4"
description = "Offline desktop pharmacy management"
authors = ["Pharmacy Management"]
edition = "2021"
rust-version = "1.89"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
rusqlite = { version = "0.41", features = ["backup", "bundled"] }
rusqlite_migration = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
tauri-plugin-updater = "2.12.0"
tauri-plugin-process = "2.3.1"
base64 = "0.22"
escpos = { version = "0.18", default-features = false, features = ["usb"] }
flume = "0.11"
image = { version = "0.25", default-features = false, features = ["png"] }
mdns-sd = "0.13"
rusb = { version = "0.9", features = ["vendored"] }

[dev-dependencies]
tempfile = "3"
